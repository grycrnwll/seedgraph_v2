[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seedgraph"
version = "0.1.0"
description = "Seedgraph v2 — local-first citation/knowledge graph substrate (Phase 0 foundation)"
requires-python = ">=3.13"
dependencies = [
    "typer",
    # click>=8.2 changed flag handling and breaks Typer's option construction
    # ("Secondary flag is not valid for non-boolean flag") — pin until Typer's
    # pinned click range is known-good against 8.2+. Without this a fresh install
    # resolves click 8.2+ and `seedgraph` / `doctor` crash at CLI build time.
    "click>=8.1,<8.2",
    "pydantic>=2",
    "pyyaml",
    "sqlmodel",
    # phase_5b: the provider chain's one genuine runtime network dep (settled per
    # the plan). Lazy-imported inside provider/fetch method bodies so the package
    # still imports without a live network; promoted from [dev] to a runtime dep
    # because the network phase needs it at runtime.
    "httpx",
    # Seeded Louvain literatures, the 2D graph layout and BFS (library/literatures.py,
    # stage 4; docs/V3_CONCEPTS_DESIGN.md §10 keeps it).
    "networkx",
    # MCP server surface (`seedgraph mcp serve`). v3 always serves MCP, so this is a
    # core dependency (it was the `[mcp]` extra in v2). Base `mcp` SDK only — NOT
    # `mcp[cli]`, whose CLI extra pulls typer/click and would fight the
    # `click>=8.1,<8.2` pin above. Still lazy-imported inside `seedgraph/mcp/*` and
    # behind the `mcp serve` command body so package import stays cheap. Floor pinned
    # to the version whose FastMCP + in-memory-transport surface chunk 0 verified
    # against; the exact version is pinned in uv.lock. Capped below 2: mcp 2.x
    # removed `mcp.shared.memory.create_connected_server_and_client_session`, which
    # the in-memory MCP tests use; moving to 2.x is a deliberate, tested bump.
    "mcp>=1.28.1,<2",
    # Golden-set check (stage 0): PDF page count for the page-marker check. Same
    # PDF engine Marker uses, so counts agree. Binary wheel, no torch. Lazy-imported
    # inside seedgraph/golden/pdf.py.
    "pypdfium2>=5.14.0",
    # Stage 3 web UI (`seedgraph serve`, docs/V3_UI_DESIGN.md §1.1): server-rendered
    # Starlette + Jinja2 pages served by plain uvicorn (not `[standard]`), and
    # python-multipart for form and upload parsing. Exact versions pinned in uv.lock.
    "starlette",
    "jinja2",
    "uvicorn",
    "python-multipart",
]
# Marker / Surya / torch are NOT here: PDF conversion runs in the separate,
# separately locked converter environment under `converter/` (see
# docs/DEPENDENCY_POLICY.md). The app environment never contains torch.
# Stage 2 removed `keyring` (scholarly-API keys come from environment variables
# only) and the old web UI's fastapi; stage 3 re-added starlette/jinja2/uvicorn/
# python-multipart for the new web UI (no FastAPI).

[project.scripts]
# Interim name: v2's `seedgraph.exe` is already on PATH, so v3 installs as
# `seedgraph-v3` until the switch-over. Renamed back to `seedgraph` at stage 7.
# `python -m seedgraph` works regardless.
seedgraph-v3 = "seedgraph.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]
# Stage 3 acceptance (docs/V3_UI_DESIGN.md §10.1): the Playwright walk-through and the
# browser highlight pass in tests/acceptance/ (marked `browser`, opt-in). Dev only, never
# an app dependency. The Chromium build is a separate one-time download:
# `uv run --group browser playwright install chromium --only-shell` (the headless shell suffices).
browser = [
    "playwright",
]

[tool.uv]
# v3 runs on uv-managed CPython (version in .python-version), never on a system
# interpreter such as the global G:\python313 that v2 uses.
python-preference = "only-managed"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seedgraph = [
    "agent_setup/*.md",
    "db/schema/cache/*.sql",
    "db/schema/project/*.sql",
    "db/schema/library/*.sql",
    "db/schema/library/provider_cache/*.sql",
    "db/schema/graph/*.sql",
    "migrate/v2_schema/project/*.sql",
    "migrate/v2_schema/cache/*.sql",
    "web/templates/**/*",
    "web/static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The opt-in real-Marker smoke test is marked `marker` and deselected by default;
# it also self-skips on ImportError (Marker is not in the app environment).
addopts = "-m 'not marker and not network and not llm_network and not corpus and not mcp_client and not browser and not live_serve'"
markers = [
    "marker: opt-in slow test that requires marker-pdf (not in the app environment) (deselected by default)",
    "network: opt-in real-network smoke test (phase_5b; deselected by default). Run with `pytest -m network`.",
    "llm_network: opt-in real-LLM smoke test (a live local Ollama; deselected by default). Run with `pytest -m llm_network`.",
    "corpus: opt-in real-corpus bibliography-overlap regression gate (Build F chunk 4; v1 criterion 11; deselected by default — the machine-local paper_library never leaves the dev box, so it never runs in CI). Run with `pytest -m corpus`.",
    "mcp_client: opt-in real-transport MCP smoke — SPAWNS the v3 MCP server (`seedgraph mcp serve`) as a subprocess and speaks stdio JSON-RPC to it (MCP plan 01 risk 6: Windows CRLF/encoding on stdio pipes). Deselected by default because the suite's posture is offline/keyless/NO SUBPROCESS; every other MCP test uses the SDK in-memory transport. Run with `pytest -m mcp_client` (mcp is a core dependency).",
    "browser: opt-in stage 3 acceptance test that drives a real Chromium through Playwright (tests/acceptance/; the `browser` dependency group plus `playwright install chromium`). Deselected by default; skips when Playwright or its browser is missing. Run with `uv run --group browser pytest -m browser`.",
    "live_serve: opt-in stage 3 acceptance test that SPAWNS `seedgraph serve` on a temp home and talks to it over real sockets (bind address, LAN refusal, Host and CSRF). Deselected by default (the suite runs no subprocesses). Run with `pytest -m live_serve`.",
]
