# Seedgraph v2 — LLM capability & pricing snapshot (reviewer requirement D9)
#
# DETERMINISTIC, STATIC SNAPSHOT. This file is the single source of truth for
# per-task LLM routing decisions (access profiles + per-task routing + no-LLM
# fallback). It is intentionally hand-pinned so that builds are reproducible.
#
# IMPORTANT — pricing is a STATIC SNAPSHOT. Treat every *_usd_per_mtok value as
# provisional and RE-VERIFY against the provider's published pricing BEFORE any
# budget enforcement / cost-gating goes live. Rows whose pricing is not
# independently confirmed carry `pricing_status: unverified`.
#
# context_window_tokens is the LOAD-BEARING field: it gates phase_4 oversize
# detection (full-text-derived artifacts that exceed a model's window) and the
# phase_8 routing/packing decisions. Keep it accurate and conservative. The
# Anthropic "standard" profiles are pinned to 200k by project convention; the
# explicit `[1m]` variant id exposes the 1M context window when a task needs it.
# (Anthropic's published windows for some of these models are larger than the
# 200k pinned here; the standard profiles deliberately gate at 200k for
# cost/latency control. Use the `[1m]` profile to opt into the full window.)
#
# Embeddings / local models: max_output_tokens and structured-output fields do
# not apply and are null. nomic-embed-text runs locally via Ollama (no per-token
# cost); input_usd_per_mtok is 0.0 with pricing_status: not_applicable.

snapshot_date: 2026-07-02
schema_version: 1

models:

  # --- Anthropic (verified against official pricing, 2026-07-02) --------------

  claude-opus-4-8:
    provider: anthropic
    context_window_tokens: 200000          # standard profile; see [1m] variant for full window
    max_output_tokens: 128000
    input_usd_per_mtok: 5.00
    output_usd_per_mtok: 25.00
    supports_structured_output: true
    access_modes: [api_key]
    pricing_status: verified
    notes: >-
      Default high-capability Claude profile. Adaptive thinking only
      (no budget_tokens). 200k window is a project gating convention; use
      claude-opus-4-8[1m] for the 1M context window (Anthropic's published
      window is 1M). Verified 2026-07-02 against
      https://platform.claude.com/docs/en/about-claude/pricing and
      https://platform.claude.com/docs/en/about-claude/models/overview.

  "claude-opus-4-8[1m]":
    provider: anthropic
    context_window_tokens: 1000000         # 1M-context variant — gates phase_4 oversize differently
    max_output_tokens: 128000
    input_usd_per_mtok: 5.00
    output_usd_per_mtok: 25.00
    supports_structured_output: true
    access_modes: [api_key]
    pricing_status: verified
    notes: >-
      1M-context variant of Opus 4.8. Anthropic bills the full 1M window at
      standard per-token pricing (no long-context premium). Route
      oversize-context phase_4/phase_8 tasks here. Verified 2026-07-02 against
      https://platform.claude.com/docs/en/about-claude/pricing (long-context
      pricing section) and
      https://platform.claude.com/docs/en/about-claude/models/overview.

  claude-sonnet-4-6:
    provider: anthropic
    context_window_tokens: 200000          # standard profile (project gating convention; published window is 1M)
    max_output_tokens: 128000              # corrected from 64000 (official max output for Sonnet 4.6)
    input_usd_per_mtok: 3.00
    output_usd_per_mtok: 15.00
    supports_structured_output: true
    access_modes: [api_key]
    pricing_status: verified
    notes: >-
      Balanced speed/intelligence profile for high-volume per-task routing.
      Model id is ACTIVE but now legacy-tier: Anthropic's current Sonnet is
      claude-sonnet-5 (same $3/$15 standard price; $2/$10 introductory through
      2026-08-31, plus a new ~30% denser tokenizer) — re-evaluate this row when
      Sonnet 4.6 is deprecated (dead-id risk). Verified 2026-07-02 against
      https://platform.claude.com/docs/en/about-claude/pricing and
      https://platform.claude.com/docs/en/about-claude/models/overview.

  claude-haiku-4-5:
    provider: anthropic
    context_window_tokens: 200000
    max_output_tokens: 64000
    input_usd_per_mtok: 1.00
    output_usd_per_mtok: 5.00
    supports_structured_output: true
    access_modes: [api_key]
    pricing_status: verified
    notes: >-
      Fastest / cheapest Claude profile for simple classification & extraction.
      Verified 2026-07-02 against
      https://platform.claude.com/docs/en/about-claude/pricing and
      https://platform.claude.com/docs/en/about-claude/models/overview
      (published window 200k / max output 64k — matches the pinned values).

