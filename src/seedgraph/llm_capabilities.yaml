  # --- Local (Ollama) generative model ---------------------------------------

  llama3:
    provider: ollama
    context_window_tokens: 8192             # LOAD-BEARING: gates phase_4 oversize for the local-first default profile
    max_output_tokens: 2048
    input_usd_per_mtok: 0.0                 # runs locally; no per-token cost
    output_usd_per_mtok: 0.0
    supports_structured_output: false       # JSON is parsed/validated app-side, not via a native structured-output API
    access_modes: [local]
    pricing_status: not_applicable
    notes: >-
      Local generative model served via Ollama; the model behind the local-first
      `local_ollama_default` profile (Llama 3 8B). The 8192-token window is the
      LOAD-BEARING field that gates phase_4 oversize detection for the default
      local route — without it the oversize gate would fail open. No per-token cost.

  "qwen3.5:latest":
    provider: ollama
    context_window_tokens: 262144           # LOAD-BEARING: trained context length reported by `ollama show qwen3.5:latest`
    max_output_tokens: 8192                 # practical serving budget; thinking model needs headroom beyond the JSON answer (must-fix #3c)
    input_usd_per_mtok: 0.0                 # runs locally; no per-token cost
    output_usd_per_mtok: 0.0
    supports_structured_output: false       # JSON is parsed/validated app-side, not via a native structured-output API
    access_modes: [local]
    pricing_status: not_applicable
    notes: >-
      Local generative model served via Ollama (qwen35 architecture, 9.7B
      params, Q4_K_M quant; completion/vision/tools/thinking capabilities).
      Context length 262144 verified locally on 2026-07-02 via
      `ollama show qwen3.5:latest` (Ollama 0.31.1). Note the effective serving
      window is Ollama's num_ctx, which may be configured lower than the
      trained window. Zero cost fields per local-model convention (mirrors
      llama3); the USD pricing gate is irrelevant for locals.

  # --- Local (Ollama) embedding model ----------------------------------------

  nomic-embed-text:
    provider: ollama
    context_window_tokens: 8192
    max_output_tokens: null                 # embedding model — no generative output
    input_usd_per_mtok: 0.0                 # runs locally; no per-token cost
    output_usd_per_mtok: 0.0
    supports_structured_output: null        # not applicable to an embedding model
    access_modes: [local]
    pricing_status: not_applicable
    notes: >-
      Local embedding model served via Ollama. Supports the no-LLM / local-first
      fallback path for vectorization. Dimension 768; context ~8192 tokens.
