# ---------------------------------------------------------------------------
# 2. EXPECTED CITATION EDGES — gold `cites` graph (doc 07 §5)
#    relation = "cites" (no endorsement implied, doc 07 §5).
#    confidence reflects author certainty BEFORE PDF verification; verify against
#    each work's reference section (phase_3b) before gating.
# ---------------------------------------------------------------------------
expected_citation_edges:
  # The survey is the densest hub — it cites every other work in the set.
  - {citing: rothsantannabilinskipoe2023, cited: goodmanbacon2021,        confidence: high}
  - {citing: rothsantannabilinskipoe2023, cited: callawaysantanna2021,    confidence: high}
  - {citing: rothsantannabilinskipoe2023, cited: sunabraham2021,          confidence: high}
  - {citing: rothsantannabilinskipoe2023, cited: dechaisemartin2020,      confidence: high}
  - {citing: rothsantannabilinskipoe2023, cited: borusyakjaravelspiess2024, confidence: high}
  - {citing: rothsantannabilinskipoe2023, cited: roth2022,                confidence: high}
  - {citing: rothsantannabilinskipoe2023, cited: atheyimbens2022,         confidence: high}

  # Sun & Abraham build directly on the TWFE-bias and group-time literature.
  - {citing: sunabraham2021, cited: callawaysantanna2021,  confidence: high}
  - {citing: sunabraham2021, cited: dechaisemartin2020,    confidence: high}
  - {citing: sunabraham2021, cited: goodmanbacon2021,      confidence: high}
  - {citing: sunabraham2021, cited: atheyimbens2022,       confidence: medium}
  - {citing: sunabraham2021, cited: borusyakjaravelspiess2024, confidence: medium}  # cites BJS working-paper version

  # Callaway & Sant'Anna (published 2021) cross-cite the contemporaneous TWFE-bias work.
  - {citing: callawaysantanna2021, cited: goodmanbacon2021,   confidence: high}
  - {citing: callawaysantanna2021, cited: dechaisemartin2020, confidence: high}
  - {citing: callawaysantanna2021, cited: sunabraham2021,     confidence: medium}
  - {citing: callawaysantanna2021, cited: atheyimbens2022,    confidence: medium}

  # Goodman-Bacon (published version) references the heterogeneity-robust estimators.
  - {citing: goodmanbacon2021, cited: dechaisemartin2020,   confidence: medium}
  - {citing: goodmanbacon2021, cited: callawaysantanna2021, confidence: medium}

  # Borusyak, Jaravel & Spiess situate the imputation estimator against prior estimators.
  - {citing: borusyakjaravelspiess2024, cited: callawaysantanna2021, confidence: high}
  - {citing: borusyakjaravelspiess2024, cited: sunabraham2021,       confidence: high}
  - {citing: borusyakjaravelspiess2024, cited: dechaisemartin2020,   confidence: high}
  - {citing: borusyakjaravelspiess2024, cited: goodmanbacon2021,     confidence: medium}

  # Roth (pre-trends) cites the event-study / heterogeneity estimators it analyzes.
  - {citing: roth2022, cited: borusyakjaravelspiess2024, confidence: high}
  - {citing: roth2022, cited: sunabraham2021,            confidence: medium}
  - {citing: roth2022, cited: callawaysantanna2021,      confidence: medium}

  # Athey & Imbens reference the staggered-adoption estimators.
  - {citing: atheyimbens2022, cited: dechaisemartin2020,   confidence: medium}
  - {citing: atheyimbens2022, cited: callawaysantanna2021, confidence: medium}
  - {citing: atheyimbens2022, cited: goodmanbacon2021,     confidence: medium}

# ---------------------------------------------------------------------------
# 3. EXPECTED CLAIMS — per-work identifying assumptions / methods / results
#    claim_type: identification_assumption | method | result
#    Each claim must, after extraction (phase_4), resolve to >=1 EvidenceSpan
#    OR carry an explicit not_found record (MVP §12). Spans filled post-fetch.
# ---------------------------------------------------------------------------
expected_claims:
  goodmanbacon2021:
    - {claim_id: gb_decomp,        claim_type: result,                    text: "The two-way fixed-effects DiD estimator equals a weighted average of all possible 2x2 DiD estimators across timing groups (the Bacon decomposition)."}
    - {claim_id: gb_negweight,     claim_type: result,                    text: "Already-treated units serve as controls for later-treated units, which can produce negative weights and bias TWFE under treatment-effect heterogeneity over time."}
    - {claim_id: gb_vwa,           claim_type: method,                    text: "Estimand is a variance-weighted average treatment effect; weights depend on group sizes and treatment-timing variance."}

  callawaysantanna2021:
    - {claim_id: cs_attgt,         claim_type: method,                    text: "Defines group-time average treatment effects ATT(g,t) as the building block for staggered designs."}
    - {claim_id: cs_cpt,           claim_type: identification_assumption, text: "Identification rests on a conditional (covariate-adjusted) parallel-trends assumption."}
    - {claim_id: cs_nyt,           claim_type: identification_assumption, text: "Either never-treated or not-yet-treated units may serve as the valid comparison group."}
    - {claim_id: cs_dr,            claim_type: method,                    text: "Estimation via doubly-robust / inverse-probability-weighting / outcome-regression estimators, then aggregation into event-study or overall summaries."}

  sunabraham2021:
    - {claim_id: sa_contamination, claim_type: result,                    text: "Under heterogeneous effects, TWFE event-study (lead/lag) coefficients are contaminated by effects from other relative periods."}
    - {claim_id: sa_catt,          claim_type: method,                    text: "Defines cohort-specific average treatment effects on the treated, CATT(e,l), by cohort and relative period."}
    - {claim_id: sa_iw,            claim_type: method,                    text: "Proposes the interaction-weighted (IW) estimator using saturated cohort-by-relative-period interactions weighted by cohort shares."}

  dechaisemartin2020:
    - {claim_id: dc_weights,       claim_type: result,                    text: "The TWFE regression coefficient is a weighted sum of treatment effects across cells, and some weights can be negative."}
    - {claim_id: dc_robust,        claim_type: method,                    text: "Proposes the DID_M estimator, valid under heterogeneous and time-varying treatment effects."}
    - {claim_id: dc_diagnostic,    claim_type: method,                    text: "Provides a diagnostic for the number/share of negative weights underlying a given TWFE estimate."}

  borusyakjaravelspiess2024:
    - {claim_id: bjs_imputation,   claim_type: method,                    text: "Imputation estimator: fit unit and period effects on untreated observations only, then impute counterfactual untreated outcomes for treated observations."}
    - {claim_id: bjs_efficient,    claim_type: result,                    text: "The imputation estimator is efficient under homoskedasticity and avoids the negative-weighting problem of TWFE."}
    - {claim_id: bjs_underid,      claim_type: identification_assumption, text: "Event-study designs are under-identified without restrictions; estimands require explicitly specified parallel-trends and no-anticipation assumptions."}

  roth2022:
    - {claim_id: roth_pretest,     claim_type: result,                    text: "Conditioning event-study estimates on having passed a pre-trends test induces selection bias and distorts inference."}
    - {claim_id: roth_power,       claim_type: result,                    text: "Pre-trends tests often have low power against the kinds of violations that most bias the treatment-effect estimate."}
    - {claim_id: roth_anticip,     claim_type: identification_assumption, text: "Analysis assumes parallel trends with no anticipation; the pre-period is used to assess that assumption's plausibility."}

  atheyimbens2022:
    - {claim_id: ai_designbased,   claim_type: method,                    text: "Adopts a design-based (randomization) framework treating the staggered adoption dates as the source of randomness."}
    - {claim_id: ai_assignment,    claim_type: identification_assumption, text: "Identification relies on an assumption that adoption timing is (conditionally) as-good-as-random, rather than on a sampling-based parallel-trends model."}
    - {claim_id: ai_finitepop,     claim_type: result,                    text: "Derives finite-population exact and asymptotic variance expressions for staggered-adoption estimators."}

  rothsantannabilinskipoe2023:
    - {claim_id: rs_synthesis,     claim_type: result,                    text: "Synthesizes the recent DiD literature: TWFE is biased under heterogeneous, dynamic treatment effects, and several heterogeneity-robust estimators have been proposed."}
    - {claim_id: rs_recommend,     claim_type: method,                    text: "Offers practical recommendations: use heterogeneity-robust estimators, report event-study plots, and conduct sensitivity analysis for parallel-trends violations."}

# ---------------------------------------------------------------------------
# 4. LEAKAGE TEST QUESTIONS — out-of-corpus abstention probes (doc 09 §9)
#    Answerable from general model memory but NOT present in this corpus.
#    Expected harness behavior: insufficient_evidence = true (abstain).
#    Authoring rule: each targets a DiD-adjacent method or fact deliberately
#    EXCLUDED from the 8 papers above. Confirm exclusion after PDFs are fetched.
# ---------------------------------------------------------------------------
leakage_test_questions:
  - id: leak_syntheticcontrol
    question: "What is the synthetic control estimator of Abadie, Diamond, and Hainmueller (2010), and how are donor-pool weights chosen?"
    rationale: "Synthetic control is a distinct method; Abadie-Diamond-Hainmueller is not in the corpus. Must abstain."
    expect: {insufficient_evidence: true}

  - id: leak_synthdid
    question: "How does the synthetic difference-in-differences estimator of Arkhangelsky et al. (2021) combine unit and time weights?"
    rationale: "Synth-DiD (Arkhangelsky et al.) is not among the 8 corpus papers. Must abstain."
    expect: {insufficient_evidence: true}

  - id: leak_honestdid
    question: "What sensitivity-analysis bounds for parallel-trends violations does the Rambachan and Roth (2023) 'honest' approach propose?"
    rationale: "HonestDiD (Rambachan & Roth 2023) is adjacent but NOT in the corpus (Roth 2022 pre-trends is a different paper). Must abstain."
    expect: {insufficient_evidence: true}

  - id: leak_clustering
    question: "What is the Bertrand, Duflo, and Mullainathan (2004) finding on serial correlation and standard errors in difference-in-differences?"
    rationale: "Serial-correlation/clustering classic (BDM 2004) is on-theme but not in the corpus. Must abstain."
    expect: {insufficient_evidence: true}

  - id: leak_didpackage
    question: "What command-line arguments does the R package 'did' expose for estimating group-time ATTs?"
    rationale: "Software/package implementation details are not full-text content of any corpus paper. Must abstain."
    expect: {insufficient_evidence: true}

  - id: leak_rdd
    question: "What local-polynomial bandwidth selector do Calonico, Cattaneo, and Titiunik (2014) recommend for regression discontinuity designs?"
    rationale: "Regression discontinuity is an unrelated identification strategy absent from the corpus. Must abstain."
    expect: {insufficient_evidence: true}

  - id: leak_nobel
    question: "Who was awarded the 2021 Nobel Memorial Prize in Economic Sciences and for what contribution?"
    rationale: "General-knowledge fact in model memory but absent from corpus full text. Must abstain."
    expect: {insufficient_evidence: true}

  - id: leak_callaway_minwage
    question: "What hourly minimum-wage threshold does the U.S. federal Fair Labor Standards Act currently set?"
    rationale: "World-knowledge fact unrelated to corpus content (avoids overlap with any empirical application). Must abstain."
    expect: {insufficient_evidence: true}
