# PROPOSED — confirm papers, fetch PDFs, and verify gold edges/claims before relying on this as the acceptance fixture.
#
# Seedgraph v2 — first evaluation corpus / gold fixture (D-first-corpus).
# Theme (doc 01): dynamic difference-in-differences — staggered adoption, event
# study, heterogeneous treatment effects, parallel trends, serial correlation.
#
# Purpose & wiring (doc 09 / phase_9_evaluation.md):
#   - `papers`                    -> the small, familiar test corpus (doc 10 §16: 5-10 papers,
#                                    known relationships, shared citations, technical assumptions,
#                                    some tables/equations). Drives phase_1 acquisition + phase_5b
#                                    identifier resolution.
#   - `expected_citation_edges`   -> gold `cites` edges (doc 07 §5) for citation-resolution audit
#                                    and the MVP §12 "included-paper citation edges present" check.
#   - `expected_claims`           -> per-work identifying assumptions / methods asserted as Claim /
#                                    IdentificationAssumption nodes (doc 07 §8); each must resolve to
#                                    >=1 EvidenceSpan or an explicit not_found record (MVP §12).
#   - `leakage_test_questions`    -> out-of-corpus probes (doc 09 §9). Answerable from general model
#                                    memory but NOT present in this corpus; the harness MUST abstain
#                                    (insufficient_evidence=true). Feeds evals .../leakage_probes.jsonl.
#
# STATUS: every identifier, access_class, edge, and claim below is an AUTHOR PROPOSAL and must be
# verified against the fetched PDFs before this file gates CI. access_class follows doc 03 / doc 12
# vocab: open_access | metadata_only | user_supplied_private. Published-journal DOIs are often
# paywalled (metadata_only); an open preprint (arXiv / NBER / author site) is preferred as the
# acquired manifestation and is listed under identifiers when known.

schema_version: 1
corpus_id: did_dynamic_v1
title: "Dynamic difference-in-differences — staggered adoption & heterogeneous effects"
theme: dynamic_difference_in_differences
status: PROPOSED
notes: >
  Hand-authored gold fixture. Confirm bibliographic identifiers, fetch open manifestations,
  then verify edges and claims against extracted spans before treating as the acceptance set.

# ---------------------------------------------------------------------------
# 1. PAPERS — the corpus (8 works; doc 10 §16 "5-10 papers")
# ---------------------------------------------------------------------------
